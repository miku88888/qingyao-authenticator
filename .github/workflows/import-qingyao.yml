name: Import Qingyao once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed source and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '340faf5b5ef5813871c57ba74ce364152968d173f745da0567c4f51035eefb3c  github-import.zip' | sha256sum -c -
          unzip -q -o github-import.zip -d .
          git rm -- github-import.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md TESTING.md THIRD_PARTY_NOTICES.md build.gradle settings.gradle app tools dist
          git commit -m 'Publish reviewed Qingyao source and signed Android 1.0.0 APK'
          git push origin HEAD:main
          imported_commit=$(git rev-parse HEAD)
          echo 'acb297c4da9b52716d9b0018518788d1c4c6126367b640f9ffbaffb3109aec53  dist/qingyao-1.0.0.apk' | sha256sum -c -
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          清钥 1.0.0 · 无广告、完全离线的安卓身份验证器

          支持 Android 8.0 及以上版本。下载 qingyao-1.0.0.apk 后传到手机安装。

          - 扫码、二维码图片导入和手动添加账号
          - TOTP 动态验证码、倒计时和一键复制
          - 本地加密、手机锁屏验证、密码加密备份及恢复
          - 仅相机权限，无网络权限、广告或统计 SDK

          已完成标准算法检查和 Android 14 模拟器流程验证，实体手机扫码兼容性尚未验证。首次安装没有预置账号。

          绑定后请保存网站的恢复代码并导出加密备份。卸载应用会删除本机账号。
          NOTES
          gh release create v1.0.0 dist/qingyao-1.0.0.apk dist/SHA256.txt --repo miku88888/qingyao-authenticator --target "$imported_commit" --title '清钥 1.0.0' --notes-file "$RUNNER_TEMP/release-notes.md"
